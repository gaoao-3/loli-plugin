<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c7fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary Blue-Purple Gradient -->
    <linearGradient id="logoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8c7fa"/>
      <stop offset="100%" stop-color="#7da0db"/>
    </linearGradient>

    <!-- Glassmorphism Panel Gradient -->
    <linearGradient id="logoGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)"/>

  <!-- Left Pillar (Glass) -->
  <rect x="20" y="20" width="20" height="60" rx="8" fill="url(#logoGlass)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Right Pillar (Solid Accent) -->
  <rect x="60" y="20" width="20" height="60" rx="8" fill="url(#logoPrimary)" filter="drop-shadow(0 0 8px rgba(168,199,250,0.4))"/>

  <!-- Center Bridge -->
  <path d="M 30 42 Q 50 32 70 42 L 70 58 Q 50 48 30 58 Z" fill="url(#logoPrimary)" opacity="0.8"/>
  
  <!-- Core Spark -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)"/>
</svg>