<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#FF2E63"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- base line, breathing opacity -->
  <line x1="0" y1="12" x2="800" y2="12" stroke="url(#beam)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- pulse traveling left to right -->
  <circle r="3.5" fill="#00F0FF" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M0 12 H800"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- pulse traveling right to left, phase-shifted -->
  <circle r="3.5" fill="#FF2E63" filter="url(#glow)">
    <animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M800 12 H0"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
